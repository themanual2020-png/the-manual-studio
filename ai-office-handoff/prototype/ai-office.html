<title>ออฟฟิศทีม AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Layout: an office floor plan as the home screen; each room opens into a two-column workroom (team + brief on the left, shared task board on the right). */
:root{
  --bg:#EEF1EC; --surface:#FBFCFA; --surface-2:#E4E9E2; --line:#CDD5CB; --ink:#1D2623; --ink-2:#56625D; --ink-3:#7D8984;
  --mkt:#D9692A; --cnt:#4C5FCF; --fin:#2E8A57; --meet:#8A6BB8; --pm:#1F7A8C; --it:#55606E;
  --good:#2E8A57; --warn:#B7791F; --bad:#C2413A;
  --plan:#C9D2C6;
  --f-display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A18; --surface:#1C2421; --surface-2:#232D29; --line:#33403B; --ink:#E6ECE8; --ink-2:#A9B6B0; --ink-3:#7F8C86;
  --mkt:#F08A4B; --cnt:#8392F0; --fin:#4DB37C; --meet:#A98BD8; --pm:#4FB3C4; --it:#9AA8B8; --good:#4DB37C; --warn:#E0A73F; --bad:#EF6B63; --plan:#2C3833; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A18; --surface:#1C2421; --surface-2:#232D29; --line:#33403B; --ink:#E6ECE8; --ink-2:#A9B6B0; --ink-3:#7F8C86;
  --mkt:#F08A4B; --cnt:#8392F0; --fin:#4DB37C; --meet:#A98BD8; --pm:#4FB3C4; --it:#9AA8B8; --good:#4DB37C; --warn:#E0A73F; --bad:#EF6B63; --plan:#2C3833; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3,h4,h5,h6{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--ink);display:grid;place-items:center;flex:none}
.brand-mark svg{width:22px;height:22px}
.brand h1{font-size:20px}
.brand small{display:block;color:var(--ink-3);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn-solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-solid:hover{background:var(--ink);opacity:.88}
.btn:disabled{opacity:.45;cursor:not-allowed}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;font-size:14px;color:var(--ink-2);margin-bottom:14px}
.notice b{color:var(--ink)}

/* floor plan */
.plan-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.plan-head p{margin:0;color:var(--ink-2);max-width:62ch}
.plan{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"pm mkt cnt" "hall hall hall" "it fin meet";
  background:var(--plan);padding:14px;border-radius:20px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
.room{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:18px 18px 16px;text-align:left;display:flex;flex-direction:column;gap:12px;min-width:0;transition:transform .15s}
.room:hover{transform:translateY(-2px)}
.room::after{content:"";position:absolute;bottom:-2px;left:28px;width:46px;height:2px;background:var(--surface)}
.room .door{display:none}
.room-title{display:flex;align-items:center;gap:10px}
.room-title .sw{width:12px;height:12px;border-radius:3px;flex:none}
.room-title h2{font-size:19px}
.room-title span.code{margin-left:auto;font-family:var(--f-num);font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
.room p{margin:0;color:var(--ink-2);font-size:14px}
.room .crew{display:flex;gap:6px}
.room .stat{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.room .stat b{color:var(--ink);font-weight:600}
.hall{grid-area:hall;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink-3);font-size:12px;letter-spacing:.14em;padding:4px}
.hall::before,.hall::after{content:"";flex:1;border-top:1.5px dashed var(--ink-3);opacity:.5}
.r-mkt{grid-area:mkt}.r-cnt{grid-area:cnt}.r-fin{grid-area:fin}.r-meet{grid-area:meet}.r-pm{grid-area:pm}.r-it{grid-area:it}
.room .alert{color:var(--bad);font-weight:600}
@media (max-width:980px){.plan{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"pm pm" "mkt cnt" "hall hall" "fin it" "meet meet"}}
@media (max-width:640px){.plan{grid-template-columns:minmax(0,1fr);grid-template-areas:"pm" "mkt" "cnt" "fin" "it" "hall" "meet"}}

/* workroom */
.dept-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;color:#fff;font-family:var(--f-display);font-size:17px}
.dept-bar .back{margin-left:auto}
.work{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.work{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:15px;margin-bottom:10px}
.panel .sub{color:var(--ink-3);font-size:13px;margin:-6px 0 10px}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:6px 2px;border-radius:10px}
.mate b{font-size:14px;font-weight:600}
.mate small{color:var(--ink-3);font-size:12px;line-height:1.35}
.mate.busy svg{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.mate.busy svg{animation:none}.room{transition:none}}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.mode{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:block;font-size:13px;color:var(--ink-2);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:14px}
textarea{min-height:96px;resize:vertical}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--ink-3);font-size:14px;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--ink-3);color:var(--ink-2)}
.drop b{color:var(--ink)}
.go{width:100%;margin-top:14px;border:none;border-radius:12px;padding:12px;font-family:var(--f-display);font-size:16px;color:#fff;display:flex;justify-content:center;gap:8px;align-items:center}
.go:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:8px}

/* board */
.board-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.board-head h3{margin:0}
.board-head small{color:var(--ink-3)}
.tasks{display:flex;flex-direction:column;gap:12px}
.task{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);min-width:0}
.task-h{display:flex;align-items:flex-start;gap:10px}
.task-h h4{font-family:var(--f-body);font-weight:600;font-size:15px;flex:1;min-width:0;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.st{font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap;font-weight:500}
.st-run{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.st-done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.st-err{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.st-wait{background:var(--surface-2);color:var(--ink-2)}
.x{border:none;background:none;color:var(--ink-3);font-size:12px;padding:2px 4px}
.x:hover{color:var(--bad)}
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.chip{flex:none;border-radius:6px;padding:0 8px;font-size:12.5px;font-weight:600;line-height:22px}
.dots{display:inline-flex;gap:3px;padding-top:9px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.out{margin-top:12px;border-radius:10px;background:var(--bg);padding:12px 14px;font-size:14px;min-width:0;overflow-wrap:anywhere}
.out h3,.out h4,.out h5,.out h6{font-size:15px;margin:12px 0 6px}
.out h3:first-child,.out h4:first-child,.out h5:first-child{margin-top:0}
.out p{margin:6px 0}.out ul,.out ol{margin:6px 0;padding-left:20px}.out li{margin:2px 0}
.out hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.out code{font-family:var(--f-num);font-size:12.5px}
.tbl{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--ink-3);font-weight:500;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.flag td{background:color-mix(in srgb,var(--bad) 9%,transparent)}
.tag{font-size:11.5px;border-radius:4px;padding:1px 6px;background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);white-space:nowrap}
.tag.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.copy{margin-top:8px}
.empty{color:var(--ink-3);font-size:14px;text-align:center;padding:28px 12px;border:1.5px dashed var(--line);border-radius:12px}

/* ledger */
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tot{border-radius:10px;background:var(--bg);padding:10px}
.tot small{display:block;color:var(--ink-3);font-size:12px}
.tot b{font-family:var(--f-num);font-size:16px;font-weight:500}
.bars{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar .track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;background:var(--fin);border-radius:4px}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lrow .d{font-family:var(--f-num);font-size:12px;color:var(--ink-3)}
.lrow .m{min-width:0}.lrow .m small{display:block;color:var(--ink-3);font-size:12px}
.lrow .amt{font-family:var(--f-num)}
.lrow .amt.in{color:var(--good)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ledger-list{max-height:360px;overflow:auto}
details summary{cursor:pointer;font-size:14px;color:var(--ink-2)}
.slip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,11em) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.slip select{padding:5px 8px;font-size:13px}
@media (max-width:480px){.slip{grid-template-columns:1fr auto}.slip select{grid-column:1/-1;grid-row:2}}

.lrow .m select{margin-top:3px;padding:3px 6px;font-size:12px;width:auto;max-width:100%;background:transparent}
.lrow{grid-template-columns:auto minmax(0,1fr) auto auto}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
.chk input{width:16px;height:16px}
.sumline{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.sumline b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.stmt-wrap{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.stmt-wrap table{font-size:12.5px}
.stmt-wrap thead th{position:sticky;top:0;background:var(--surface);z-index:1}
.stmt-wrap td select{padding:3px 6px;font-size:12px;width:auto;max-width:12em;background:transparent}
.stmt-wrap tr.skip td{opacity:.45}
.stmt-wrap td.desc{min-width:12em}
.amt-in{color:var(--good)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
/* review badge */
.review{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:13.5px;border:1px solid var(--line)}
.review.pass{border-color:color-mix(in srgb,var(--good) 45%,var(--line));background:color-mix(in srgb,var(--good) 7%,transparent)}
.review.fix{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 8%,transparent)}
.review b{font-weight:600}
.review ul{margin:6px 0 0;padding-left:18px}
.review .lv{font-size:11px;border-radius:4px;padding:0 5px;margin-right:4px}
.lv-high{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.lv-medium{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.lv-low{background:var(--surface-2);color:var(--ink-2)}
.lv-ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.rv-btn{margin-top:10px;font-size:13px;padding:5px 12px}

/* PM overview */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi small{display:block;font-size:12.5px;color:var(--ink-3)}
.kpi b{font-family:var(--f-num);font-size:24px;font-weight:500;line-height:1.3}
.kpi.hot{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.kpi.hot b{color:var(--bad)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.projs{display:flex;flex-direction:column;gap:12px}
.proj{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.proj-h{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.proj-h h4{font-family:var(--f-body);font-weight:600;font-size:15px;flex:1;min-width:10em;overflow-wrap:anywhere}
.ptag{font-size:11.5px;border-radius:999px;padding:1px 9px;white-space:nowrap;border:1px solid var(--line);color:var(--ink-2)}
.ptag.client{border-color:color-mix(in srgb,var(--pm) 50%,var(--line));color:var(--pm)}
.prog{display:flex;align-items:center;gap:10px;margin:8px 0 6px;font-size:12.5px;color:var(--ink-3)}
.prog .track{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog .fill{height:100%;background:var(--pm)}
.ptask{display:grid;grid-template-columns:7.2em minmax(0,1fr) minmax(0,9.5em) 8.6em auto;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.ptask select,.ptask input{padding:4px 6px;font-size:12.5px;background:transparent}
.ptask .t{min-width:0;overflow-wrap:anywhere}
.ptask.done .t{color:var(--ink-3);text-decoration:line-through}
.ptask .od{color:var(--bad)}
@media (max-width:640px){.ptask{grid-template-columns:7.2em minmax(0,1fr) auto}.ptask .own,.ptask .due{grid-column:2/4}}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{padding:6px 9px;font-size:13px}
.mini{display:flex;flex-direction:column}
.mini a,.mini button.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:13.5px;color:var(--ink);width:100%}
.mini .dot{width:9px;height:9px;border-radius:50%}
.mini .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-col{width:28px}

/* IT */
.site{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.site .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ink-3)}
.site .dot.ok{background:var(--good)}.site .dot.bad{background:var(--bad)}
.site small{display:block;color:var(--ink-3);font-size:12px;overflow-wrap:anywhere}
/* modal */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}
.modal h2{font-size:19px;margin-bottom:4px}
.modal p{margin:0 0 8px;color:var(--ink-2);font-size:14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="var(--bg)" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></div>
      <div><h1 id="coName">ออฟฟิศทีม AI</h1><small id="coSub">ทีมผู้ช่วย AI แยกตามแผนก</small></div>
    </div>
    <button class="btn" id="brandBtn" type="button">ข้อมูลบริษัท</button>
  </header>
  <div id="notice" hidden></div>
  <main id="view"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
"use strict";

function md(src){
  const lines = esc(src).split("\n"); let out="", i=0;
  const inl = s => s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const isT=l=>/^\s*\|/.test(l), isH=l=>/^#{1,4}\s/.test(l), isU=l=>/^\s*[-*•]\s+/.test(l), isO=l=>/^\s*\d+[.)]\s+/.test(l), isR=l=>/^\s*(-{3,}|\*{3,})\s*$/.test(l);
  while(i<lines.length){
    const l=lines[i];
    if(isT(l)){ const rows=[]; while(i<lines.length&&isT(lines[i])) rows.push(lines[i++]);
      const cells=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
      const body=rows.filter(r=>!/^\s*\|[\s:\-|]+\|?\s*$/.test(r)); if(!body.length) continue;
      out+=`<div class="tbl"><table><thead><tr>${cells(body[0]).map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; continue; }
    if(isR(l)){ out+="<hr>"; i++; continue; }
    if(isH(l)){ const m=l.match(/^(#{1,4})\s+(.*)/); const n=Math.min(m[1].length+2,6); out+=`<h${n}>${inl(m[2])}</h${n}>`; i++; continue; }
    if(isU(l)){ out+="<ul>"; while(i<lines.length&&isU(lines[i])) out+=`<li>${inl(lines[i++].replace(/^\s*[-*•]\s+/,""))}</li>`; out+="</ul>"; continue; }
    if(isO(l)){ out+="<ol>"; while(i<lines.length&&isO(lines[i])) out+=`<li>${inl(lines[i++].replace(/^\s*\d+[.)]\s+/,""))}</li>`; out+="</ol>"; continue; }
    if(!l.trim()){ i++; continue; }
    const p=[]; while(i<lines.length&&lines[i].trim()&&!isT(lines[i])&&!isH(lines[i])&&!isU(lines[i])&&!isO(lines[i])&&!isR(lines[i])) p.push(lines[i++]);
    if(!p.length){ p.push(lines[i++]); }
    out+=`<p>${inl(p.join("<br>"))}</p>`;
  }
  return out;
}

// ---------- task runner ----------
async function runTask(dept, title, mode, fn){
  if(!S.sample){ toast("ยังใช้ AI ไม่ได้ในหน้านี้"); return; }
  const id = await createTask({dept,title,mode});
  MINE.add(id);
  const steps=[];
  const step = async (agent,text) => { steps.push({agent,text}); S.busy[dept]=agent; await patchTask(id,{steps:[...steps]}); render(); };
  const live = text => { S.live[id]=text; const el=document.getElementById("live-"+id); if(el) el.innerHTML=md(text); };
  try{
    const result = await fn({step,live});
    await patchTask(id,{status:"done",result,steps:[...steps]});
  }catch(e){
    console.warn(e);
    await patchTask(id,{status:"error",error:errText(e),steps:[...steps]});
  }finally{ MINE.delete(id); delete S.live[id]; delete S.busy[dept]; render(); }
}

async function readSheet(file){
  if(!window.XLSX) throw {message:"โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ ลองรีเฟรชหน้า"};
  const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true});
  if(!rows.length) throw {message:"ไม่พบข้อมูลในชีตแรกของไฟล์"};
  return rows;
}
function aggregate(rows,m){
  const g=new Map();
  for(const r of rows){
    const name = m.campaign ? String(r[m.campaign]??"").trim() : "ทั้งบัญชี"; if(!name) continue;
    if(/^(total|รวม|grand total|ผลรวม)/i.test(name)) continue;
    const plat = m.platform ? String(r[m.platform]??"").trim() : "";
    const k=name+"||"+plat; const a=g.get(k)||{name,platform:plat,spend:0,revenue:0,conv:0,clicks:0,impr:0};
    a.spend+=num(r[m.spend]); if(m.revenue) a.revenue+=num(r[m.revenue]); if(m.conversions) a.conv+=num(r[m.conversions]);
    if(m.clicks) a.clicks+=num(r[m.clicks]); if(m.impressions) a.impr+=num(r[m.impressions]); g.set(k,a);
  }
  const list=[...g.values()].filter(a=>a.spend>0).map(a=>({...a,
    roas: m.revenue ? (a.spend? a.revenue/a.spend : null) : null,
    cpa: m.conversions && a.conv ? a.spend/a.conv : null,
    ctr: m.clicks && m.impressions && a.impr ? a.clicks/a.impr*100 : null})).sort((x,y)=>y.spend-x.spend);
  const cpas=list.map(a=>a.cpa).filter(v=>v!=null).sort((a,b)=>a-b); const med=cpas.length?cpas[Math.floor(cpas.length/2)]:null;
  list.forEach(a=>{ a.flag = m.revenue ? (a.roas<1 ? "ROAS ต่ำกว่า 1" : "") : (m.conversions && a.conv===0 ? "ไม่มีผลลัพธ์" : (med && a.cpa>med*2 ? "CPA สูงกว่าค่ากลาง 2 เท่า" : "")); });
  const T=list.reduce((t,a)=>({spend:t.spend+a.spend,revenue:t.revenue+a.revenue,conv:t.conv+a.conv}),{spend:0,revenue:0,conv:0});
  return {list,T,med};
}
async function doAds(file,note){
  await runTask("marketing",`วิเคราะห์ไฟล์แอด: ${file.name}`,"ads",async({step,live})=>{
    await step("tarang",`ได้ไฟล์ ${file.name} แล้ว กำลังเปิดดูข้อมูล`);

ตอบ JSON array เท่านั้น หนึ่ง object ต่อหนึ่งรูป: [{"date":"YYYY-MM-DD หรือ null","merchant":"ร้าน/ผู้รับ/ผู้จ่าย","amount":0,"kind":"expense","category":"...","note":"รายละเอียดสั้นๆ เช่น เลขที่อ้างอิง/รายการ","confidence":"high|medium|low"}]`,{images:files,modelTier:"default"});
    const items=(Array.isArray(r)?r:[]).map(x=>{

    });
    await step("scan",`อ่านได้ ${items.length} รายการ: ${items.map(i=>`${i.merchant} ${baht(i.amount)}`).join(", ")}`);
    const issues=[];

function pageLines(items){
  const rows=[];
  for(const it of items){ if(!it.str||!it.str.trim()) continue; const y=it.transform[5], x=it.transform[4];
    let r=rows.find(r=>Math.abs(r.y-y)<2.5); if(!r){ r={y,parts:[]}; rows.push(r); } r.parts.push({x,s:it.str,w:it.width||0}); }
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>{ r.parts.sort((a,b)=>a.x-b.x); let out="", end=null;
    for(const p of r.parts){ if(end!=null) out += (p.x-end>12) ? "  |  " : (p.x-end>1.5 ? " " : ""); out+=p.s; end=p.x+p.w; } return out; }).join("\n");
}
async function pageImage(page){
  const v1=page.getViewport({scale:1}); const scale=Math.min(2.2,1700/v1.width); const vp=page.getViewport({scale});
  const c=document.createElement("canvas"); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
  const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  return await new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",0.88));
}

async function doStmt(file,password,asImage){
  await runTask("finance",`อ่าน Statement: ${file.name}`,"stmt",async({step})=>{
    await step("scan",`ได้ไฟล์ ${file.name} แล้ว กำลังเปิดอ่าน`);
    if(!window.pdfjsLib) throw {message:"โหลดตัวอ่าน PDF ไม่สำเร็จ ลองรีเฟรชหน้า"};
    let pdf;
    try{ pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),password:password||undefined,isEvalSupported:false}).promise; }
    catch(e){ if(e&&e.name==="PasswordException") throw {message: password?"รหัสผ่าน PDF ไม่ถูกต้อง ลองใส่ใหม่แล้วส่งงานอีกครั้ง":"ไฟล์นี้ล็อกรหัสผ่านไว้ ใส่รหัสในช่อง “รหัส PDF” แล้วส่งงานใหม่ (ธนาคารส่วนใหญ่ใช้วันเดือนปีเกิดหรือเลขบัตรประชาชน)"}; throw {message:"เปิดไฟล์ PDF ไม่ได้ ตรวจว่าเป็นไฟล์ PDF ที่ไม่เสีย"}; }
    const pages=Math.min(pdf.numPages,40);
    const texts=[]; for(let p=1;p<=pages;p++){ const pg=await pdf.getPage(p); const tc=await pg.getTextContent(); texts.push(pageLines(tc.items)); }
    const chars=texts.join("").replace(/\s/g,"").length;
    let raw=[], meta={};
    const take=r=>{ if(r&&Array.isArray(r.items)) raw.push(...r.items); if(r&&!meta.bank&&r.bank) meta.bank=r.bank; if(r&&!meta.account&&r.account) meta.account=r.account; };
    if(!asImage && chars>300){
      const chunks=[]; let cur="";
      texts.forEach((t,i)=>{ const block=`--- หน้า ${i+1} ---\n${t}\n`; if(cur && cur.length+block.length>14000){ chunks.push(cur); cur=""; } cur+=block; }); if(cur) chunks.push(cur);
      await step("scan",`ไฟล์มี ${pdf.numPages} หน้า${pdf.numPages>pages?` (อ่าน ${pages} หน้าแรก)`:""} ดึงข้อความได้ แบ่งอ่าน ${chunks.length} ส่วน`);
      for(let i=0;i<chunks.length;i++){
        take(await askJson(stmtPrompt(`ส่วนที่ ${i+1}/${chunks.length}`,`ข้อความที่ดึงจาก PDF (ช่องว่างแบบ "|" คือการเว้นระยะระหว่างคอลัมน์):\n${chunks[i]}`)));
        if(chunks.length>1 && i<chunks.length-1) await step("scan",`อ่านส่วนที่ ${i+1}/${chunks.length} แล้ว ได้ ${raw.length} รายการ`);
      }
    }
    if(!raw.length){
      if(!S.imgMax) throw {message:"ไฟล์นี้เป็นภาพสแกนหรืออ่านข้อความไม่ได้ และมุมมองนี้ส่งรูปให้ AI ไม่ได้"};
      const lim=Math.min(pages,20);
      await step("scan", chars>300?`อ่านจากข้อความไม่ได้ เปลี่ยนเป็นอ่านจากภาพ ${lim} หน้า`:`ไฟล์เป็นภาพ กำลังอ่านจากภาพ ${lim} หน้า`);
      for(let a=1;a<=lim;a+=S.imgMax){
        const b=Math.min(lim,a+S.imgMax-1); const imgs=[]; for(let p=a;p<=b;p++) imgs.push(await pageImage(await pdf.getPage(p)));
        take(await askJson(stmtPrompt(`หน้า ${a}-${b} จาก ${lim} หน้า`,`รูปที่แนบคือหน้า ${a} ถึง ${b} ของ statement เรียงตามลำดับ`),{images:imgs}));
        if(b<lim) await step("scan",`อ่านหน้า ${a}-${b} แล้ว ได้ ${raw.length} รายการ`);
      }
    }
    let items=raw.slice(0,500).map(x=>{
      const kind=x?.dir==="in"?"income":"expense"; const cats=kind==="income"?catsInc():catsExp();
      const desc=String(x?.desc||"").slice(0,80)||"ไม่ระบุ"; const mem=S.catmap[descKey(desc)];
      const bal=x?.balance==null||x.balance===""?null:num(x.balance);
      return {date:/^\d{4}-\d{2}-\d{2}$/.test(x?.date||"")?x.date:null,desc,amount:Math.round(num(x?.amount)*100)/100,kind,balance:bal,
        category: mem&&kindOf(mem,kind)===kind ? mem : (cats.includes(x?.category)?x.category:fallbackCat(kind)), remembered:!!mem};
    }).filter(it=>it.amount>0);
    if(!items.length) throw {message:"ไม่พบรายการเดินบัญชีในไฟล์นี้ ถ้าเป็น statement จริง ลองติ๊ก “อ่านเป็นภาพ” แล้วส่งใหม่"};
    const tin=items.filter(i=>i.kind==="income").reduce((s,i)=>s+i.amount,0), tout=items.filter(i=>i.kind!=="income").reduce((s,i)=>s+i.amount,0);
    await step("scan",`ดึงได้ ${items.length} รายการ${meta.bank?` จาก ${meta.bank}${meta.account?" บัญชี "+meta.account:""}`:""} เงินเข้า ${baht(tin)} เงินออก ${baht(tout)}`);
    // checks
    let chain=0, chainOk=0, dups=0;
    items.forEach((it,i)=>{
      const f=[];
      if(!it.date) f.push("ไม่มีวันที่");
      const prev=items[i-1];
      if(prev && prev.balance!=null && it.balance!=null){ chain++; const exp=prev.balance+(it.kind==="income"?it.amount:-it.amount);
        if(Math.abs(exp-it.balance)<0.02) chainOk++; else f.push("ยอดคงเหลือไม่ต่อเนื่อง"); }
      it.dup=!!S.ledger.find(l=>l.date===it.date&&l.kind===it.kind&&Math.abs(num(l.amount)-it.amount)<0.01);
      if(it.dup){ f.push("มีในบัญชีแล้ว"); dups++; }
      it.flags=f;
    });
    const bad=chain-chainOk;
    await step("check", chain ? (bad ? `ตรวจยอดคงเหลือแล้ว ต่อเนื่อง ${chainOk}/${chain} รายการ มี ${bad} จุดที่ยอดไม่ต่อกัน ไฮไลต์ไว้ให้ดู (อาจอ่านตัวเลขผิดหรือขาดรายการ)` : `ตรวจยอดคงเหลือแล้ว ต่อเนื่องครบทั้ง ${chainOk} รายการ ตัวเลขน่าเชื่อถือ`) : `ไฟล์ไม่มียอดคงเหลือให้ตรวจ ควรเทียบยอดรวมกับ statement อีกครั้ง`);
    const mem=items.filter(i=>i.remembered).length;
    await step("ban",`จัดหมวดให้แล้ว${mem?` (${mem} รายการใช้หมวดที่ทีมเคยกำหนด)`:""}${dups?` ข้ามรายการที่มีในบัญชีแล้ว ${dups} รายการ`:""} ตรวจหมวดแล้วกด “บันทึกลงบัญชี” ถ้าแก้หมวด ระบบจะจำไว้ใช้ครั้งหน้า`);
    return {kind:"stmt",bank:meta.bank||null,account:meta.account||null,items,tin,tout,chain,chainOk,saved:false};
  });
}
function monthFigures(m){
  const rows=S.ledger.filter(l=>monthKey(l.date)===m);
  const inc=rows.filter(r=>r.kind==="income"), exp=rows.filter(r=>r.kind!=="income");
  const sum=a=>a.reduce((s,r)=>s+num(r.amount),0);
  const byCat=a=>{ const o={}; a.forEach(r=>o[r.category||"อื่นๆ"]=(o[r.category||"อื่นๆ"]||0)+num(r.amount)); return Object.entries(o).sort((x,y)=>y[1]-x[1]); };
  return {rows,income:sum(inc),expense:sum(exp),profit:sum(inc)-sum(exp),incCat:byCat(inc),expCat:byCat(exp),count:rows.length};
}

const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const addDays = (iso,n) => { const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const thDate = iso => { if(!iso) return "–"; const [y,m,d]=iso.split("-").map(Number); return `${d} ${TH_M[m-1]}${y!==new Date().getFullYear()?" "+(y+543):""}`; };
const P_ST = {todo:"รอทำ",doing:"กำลังทำ",review:"รอตรวจ",done:"เสร็จแล้ว"};
const P_ORD = {review:0,doing:1,todo:2,done:3};
const PRI = {high:"ด่วน",normal:"ปกติ",low:"ไม่ด่วน"};
const LVL = {high:"ด่วน",medium:"ควรแก้",low:"เล็กน้อย",ok:"ผ่าน"};
const DEPT_KEYS = ["marketing","content","finance","it","pm"];
function ownerLabel(o){ if(!o) return "ยังไม่กำหนด"; if(o.startsWith("dept:")) return DEPTS[o.slice(5)]?.name||"ทีม"; if(o.startsWith("u:")) return S.names[o.slice(2)]||"สมาชิก"; return o; }
function projStats(p){ const T=todayISO(); const ts=S.ptasks.filter(t=>t.projectId===p.id); const done=ts.filter(t=>t.status==="done").length; const od=ts.filter(t=>t.status!=="done"&&t.due&&t.due<T).length; return {ts,done,total:ts.length,od}; }

function auditHtml(html,url){

  else add("ok","SEO",`มี title: “${title.slice(0,70)}”`);

  if(!desc) add("medium","SEO","ไม่มี meta description (ข้อความใต้ชื่อเว็บในผลค้นหา Google)");

  else add("ok","SEO","มี meta description");

  const h1=qa("h1").length; if(!h1) add("medium","SEO","ไม่มีหัวข้อหลัก <h1>"); else if(h1>1) add("low","SEO",`มี <h1> ${h1} อัน ควรมีอันเดียวต่อหน้า`); else add("ok","SEO","มีหัวข้อหลัก <h1>");
  const imgs=qa("img"), noAlt=imgs.filter(i=>!i.hasAttribute("alt")); if(noAlt.length) add("medium","การเข้าถึง",`รูป ${noAlt.length} จาก ${imgs.length} รูปไม่มีคำอธิบาย (alt) ส่งผลต่อ SEO และผู้พิการทางสายตา`);
  if(!q('link[rel="canonical" i]')) add("low","SEO","ไม่มี canonical URL (ช่วยกัน Google มองว่าเนื้อหาซ้ำ)");
  if(!q('meta[property="og:title" i]')||!q('meta[property="og:image" i]')) add("low","โซเชียล","ไม่มี og:title หรือ og:image เวลาแชร์ลิงก์ใน Facebook/LINE จะไม่มีรูปหรือชื่อที่ตั้งใจ");
  const httpRes=qa("script[src],link[href],img[src],iframe[src],source[src]").map(e=>e.getAttribute("src")||e.getAttribute("href")).filter(u=>/^http:\/\//i.test(u||""));
  if(httpRes.length) add(!url||/^https:/i.test(url)?"high":"medium","ความปลอดภัย",`โหลดไฟล์ผ่าน http:// ที่ไม่เข้ารหัส ${httpRes.length} รายการ เช่น ${httpRes[0].slice(0,80)}`);
  if(/^http:\/\//i.test(url)) add("high","ความปลอดภัย","เว็บใช้ http:// ไม่มี SSL เบราว์เซอร์จะขึ้นเตือนว่าไม่ปลอดภัย");
  const httpForm=qa("form").filter(f=>/^http:\/\//i.test(f.getAttribute("action")||"")); if(httpForm.length) add("high","ความปลอดภัย",`ฟอร์ม ${httpForm.length} อันส่งข้อมูลผ่าน http:// ข้อมูลลูกค้าอาจถูกดักอ่านได้`);
  const blank=qa('a[target="_blank"]').filter(a=>!/noopener|noreferrer/i.test(a.getAttribute("rel")||"")); if(blank.length) add("low","ความปลอดภัย",`ลิงก์เปิดแท็บใหม่ ${blank.length} ลิงก์ไม่มี rel="noopener"`);
  const gen=q('meta[name="generator" i]')?.getAttribute("content"); if(gen) add("low","ความปลอดภัย",`โค้ดเปิดเผยระบบและเวอร์ชัน (${gen.slice(0,60)}) ควรซ่อนเพื่อลดความเสี่ยงถูกโจมตีช่องโหว่ที่รู้จัก`);
  if(!q('link[rel~="icon" i]')) add("low","แบรนด์","ไม่พบ favicon (ไอคอนบนแท็บเบราว์เซอร์)");

  const ext=qa("script[src]"); const kb=Math.round(new Blob([html]).size/1024);

  return {checks:C,meta:{title,kb,images:imgs.length,links:qa("a[href]").length,scripts:ext.length,scriptHosts:hosts.slice(0,15),generator:gen||null},
    text:(doc.body?.textContent||"").replace(/\s+/g," ").trim().slice(0,3500),head:(doc.head?.innerHTML||"").replace(/\s+/g," ").slice(0,2500)};
}

function captureInputs(){ const o={}; document.querySelectorAll("#view input[id],#view textarea[id],#view select[id]").forEach(el=>{ if(el.type==="file"||el.hasAttribute("data-nr")) return; o[el.id]= el.type==="checkbox" ? {c:el.checked} : el.value; }); const a=document.activeElement; const sc=document.querySelectorAll(".stmt-wrap"); return {o,focus:a&&a.id,scroll:[...sc].map(s=>[s.dataset.t,s.scrollTop])}; }
function restoreInputs(k){ Object.entries(k.o).forEach(([id,v])=>{ const el=document.getElementById(id); if(!el||el.type==="file"||el.hasAttribute("data-nr")) return; if(typeof v==="object"){ if(el.type==="checkbox") el.checked=v.c; } else el.value=v; });
  (k.scroll||[]).forEach(([t,y])=>{ const s=document.querySelector(`.stmt-wrap[data-t="${t}"]`); if(s) s.scrollTop=y; });
  if(k.focus){ const el=document.getElementById(k.focus); if(el) el.focus({preventScroll:true}); } }

function monthsAvail(){ const s=new Set([thisMonth()]); S.ledger.forEach(l=>l.date&&s.add(monthKey(l.date))); return [...s].sort().reverse(); }

function taskHtml(t){
  const st = t.status==="done"?`<span class="st st-done">เสร็จแล้ว</span>`: t.status==="error"?`<span class="st st-err">ทำไม่สำเร็จ</span>`: stale(t)?`<span class="st st-err">งานค้าง</span>`:`<span class="st st-run">กำลังทำ</span>`;
  const by=t.byId&&S.names[t.byId]?` · โดย ${esc(S.names[t.byId])}`:"";
  const steps=(t.steps||[]).map(s=>`<li>${chip(s.agent)}<span>${esc(s.text)}</span></li>`).join("");
  const running=t.status==="running"&&!stale(t);
  let out="";
  if(running){ out = S.live[t.id] ? `<div class="out" id="live-${t.id}">${md(S.live[t.id])}</div>` : `<div class="out" id="live-${t.id}"><span class="dots"><i></i><i></i><i></i></span></div>`; }
  else if(t.status==="error") out=`<div class="out">${esc(t.error||"เกิดข้อผิดพลาด")}</div>`;
  else if(t.result) out=resultHtml(t);
  return `<article class="task" data-id="${t.id}"><div class="task-h"><div style="flex:1;min-width:0"><h4>${esc(t.title)}</h4><div class="meta">${esc(ago(t.createdAt))}${by}</div></div>${st}<button type="button" class="x" data-del="${t.id}">${S.confirmDel===t.id?"ยืนยันลบ":"ลบ"}</button></div>
    <ul class="steps">${steps}</ul>${out}${reviewHtml(t)}</article>`;
}
function reviewHtml(t){
  if(t.dept==="pm"||t.status!=="done"||!t.result) return "";
  if(S.reviewing[t.id]) return `<div class="review"><span class="meta">พี่ตรวจ (PM) กำลังตรวจงานนี้</span> <span class="dots"><i></i><i></i><i></i></span></div>`;
  const rv=t.review;
  if(!rv) return S.sample?`<button type="button" class="btn rv-btn" data-review="${t.id}">ให้ PM ตรวจงานนี้</button>`:"";
  return `<div class="review ${rv.verdict==="fix"?"fix":"pass"}"><b>PM ตรวจแล้ว: ${rv.verdict==="fix"?"มีจุดควรแก้":"ผ่าน"}</b>${rv.note?` · ${esc(rv.note)}`:""}
    ${(rv.issues||[]).length?`<ul>${rv.issues.map(i=>`<li><span class="lv lv-${esc(i.level)}">${LVL[i.level]||""}</span>${esc(i.text)}</li>`).join("")}</ul>`:""}
    <div class="meta">${esc(ago(rv.at))}${S.sample?` · <button type="button" class="x" data-review="${t.id}" style="padding:0">ตรวจใหม่</button>`:""}</div></div>`;
}
function resultHtml(t){
  const r=t.result;
  if(r.kind==="ads"){
    const head=`<tr><th>แคมเปญ</th>${r.rows.some(x=>x.p)?"<th>แพลตฟอร์ม</th>":""}<th class="n">ใช้เงิน</th>${r.hasRev?`<th class="n">ยอดขาย</th><th class="n">ROAS</th>`:""}${r.hasConv?`<th class="n">ผลลัพธ์</th><th class="n">CPA</th>`:""}<th></th></tr>`;
    const hasP=r.rows.some(x=>x.p);
    const rows=r.rows.map(x=>`<tr class="${x.f?"flag":""}"><td>${esc(x.n)}</td>${hasP?`<td>${esc(x.p)}</td>`:""}<td class="n">${fmt(x.s,0)}</td>${r.hasRev?`<td class="n">${fmt(x.r,0)}</td><td class="n">${fmt(x.ro)}</td>`:""}${r.hasConv?`<td class="n">${fmt(x.c,0)}</td><td class="n">${fmt(x.cpa,0)}</td>`:""}<td>${x.f?`<span class="tag">${esc(x.f)}</span>`:""}</td></tr>`).join("");
    return `<div class="out"><div class="tbl"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>${r.more?`<p class="meta">และอีก ${r.more} แคมเปญที่ใช้เงินน้อยกว่า</p>`:""}<hr>${md(r.md)}</div>`;
  }
  if(r.kind==="report") return `<div class="out">${md(r.figures)}<hr>${md(r.md)}</div>`;
  if(r.kind==="breakdown"){
    const sk=S.skip[t.id]||{}, p=r.project; const n=r.tasks.filter((_,i)=>!sk[i]).length;
    const rows=r.tasks.map((x,i)=>`<tr class="${!r.saved&&sk[i]?"skip":""}">${r.saved?"":`<td><input type="checkbox" id="bx-${t.id}-${i}" data-nr data-skip="${t.id}" data-i="${i}" ${sk[i]?"":"checked"} aria-label="เลือกงาน ${i+1}"></td>`}
      <td>${esc(x.title)}${(x.flags||[]).map(f=>` <span class="tag w">${esc(f)}</span>`).join("")}</td><td>${x.dept==="team"?"ทีมงาน":esc(DEPTS[x.dept]?.name||"")}</td><td class="n">${thDate(x.due)}</td><td>${PRI[x.priority]||""}</td></tr>`).join("");
    return `<div class="out"><p><b>${esc(p.name)}</b> · ${p.type==="client"?`งานลูกค้า${p.client?" "+esc(p.client):""}`:"งานภายใน"} · ส่ง ${thDate(p.due)}</p>${r.summary?`<p>${esc(r.summary)}</p>`:""}${r.risks?.length?`<p class="meta">ความเสี่ยง: ${r.risks.map(esc).join(" · ")}</p>`:""}
      <div class="stmt-wrap" data-t="${t.id}"><table><thead><tr>${r.saved?"":"<th></th>"}<th>งาน</th><th>ผู้รับผิดชอบ</th><th class="n">กำหนดส่ง</th><th>ความด่วน</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${r.saved?`<p class="meta" style="margin-top:10px">สร้างโปรเจกต์แล้ว ดูและอัปเดตงานได้ในส่วนโปรเจกต์ด้านบน</p>`:`<div class="tools"><button type="button" class="btn btn-solid" data-mkproj="${t.id}" ${n?"":"disabled"}>สร้างโปรเจกต์พร้อม ${n} งาน</button></div>`}</div>`;
  }
  if(r.kind==="audit"){
    const ord={high:0,medium:1,low:2,ok:3}; const cs=[...(r.checks||[])].sort((a,b)=>ord[a.level]-ord[b.level]);
    const tbl=cs.length?`<div class="tbl"><table><thead><tr><th>ระดับ</th><th>ด้าน</th><th>ผลตรวจจากโค้ด</th></tr></thead><tbody>${cs.map(c=>`<tr><td><span class="lv lv-${esc(c.level)}">${LVL[c.level]}</span></td><td style="white-space:nowrap">${esc(c.area)}</td><td>${esc(c.text)}</td></tr>`).join("")}</tbody></table></div><hr>`:"";
    return `<div class="out">${tbl}${md(r.md)}</div><button type="button" class="btn copy" data-copy="${t.id}">คัดลอกรายงาน</button>`;
  }
  if(r.kind==="slips"){
    const ed=S.slipEdit[t.id]||{};
    const rows=r.items.map((it,i)=>{ const cur=ed[i]??it.category; const k=kindOf(cur,it.kind);
      return `<div class="slip"><div style="min-width:0"><b>${esc(it.merchant)}</b> <span class="meta">${it.date?esc(it.date):"ไม่มีวันที่"} · ${k==="income"?"รายรับ":"รายจ่าย"}</span>${it.note?`<div class="meta">${esc(it.note)}</div>`:""}${(it.flags||[]).map(f=>`<span class="tag w">${esc(f)}</span> `).join("")}</div>
      ${r.saved?`<span class="meta">${esc(cur)}</span>`:catSelect(`sc-${t.id}-${i}`,cur,`data-slip="${t.id}" data-i="${i}" aria-label="หมวดของ ${esc(it.merchant)}"`)}
      <span class="num" style="text-align:right">${baht(it.amount)}</span></div>`; }).join("");
    const n=pickItems(t).length;
    return `<div class="out">${rows}${r.saved?`<p class="meta" style="margin-top:10px">บันทึกลงบัญชีแล้ว ${r.savedCount??0} รายการ</p>`:`<button type="button" class="btn btn-solid" style="margin-top:10px" data-save="${t.id}" ${n?"":"disabled"}>บันทึกลงบัญชี ${n} รายการ</button>${n<r.items.length?`<p class="meta">รายการที่ไม่มียอด ไม่มีวันที่ หรือซ้ำกับบัญชีเดิม จะไม่ถูกบันทึก</p>`:""}`}</div>`;
  }
  if(r.kind==="stmt"){
    const ed=S.slipEdit[t.id]||{}, sk=S.skip[t.id]||{};
    const rows=r.items.map((it,i)=>{ const cur=ed[i]??it.category; const k=kindOf(cur,it.kind); const off=r.saved?false:(sk[i]??it.dup);
      return `<tr class="${off?"skip":""} ${(it.flags||[]).includes("ยอดคงเหลือไม่ต่อเนื่อง")?"flag":""}">
        ${r.saved?"":`<td><input type="checkbox" id="sx-${t.id}-${i}" data-nr data-skip="${t.id}" data-i="${i}" ${off?"":"checked"} aria-label="เลือกรายการ ${i+1}"></td>`}
        <td class="n">${esc((it.date||"–").slice(2))}</td>
        <td class="desc">${esc(it.desc)}${(it.flags||[]).map(f=>` <span class="tag ${f==="มีในบัญชีแล้ว"?"w":""}">${esc(f)}</span>`).join("")}${it.remembered&&ed[i]==null?` <span class="meta">· จำจากครั้งก่อน</span>`:""}</td>
        <td>${r.saved?esc(cur):catSelect(`sc-${t.id}-${i}`,cur,`data-slip="${t.id}" data-i="${i}" aria-label="หมวดรายการ ${i+1}"`)}</td>
        <td class="n amt-in">${k==="income"?fmt(it.amount):""}</td><td class="n">${k!=="income"?fmt(it.amount):""}</td>
        <td class="n" style="color:var(--ink-3)">${it.balance!=null?fmt(it.balance):""}</td></tr>`; }).join("");
    const n=pickItems(t).length;
    return `<div class="out"><div class="sumline">${r.bank?`<span>${esc(r.bank)}${r.account?" · "+esc(r.account):""}</span>`:""}<span>${r.items.length} รายการ</span><span>เงินเข้า <b class="amt-in">${baht(r.tin)}</b></span><span>เงินออก <b>${baht(r.tout)}</b></span>${r.chain?`<span>ยอดคงเหลือต่อเนื่อง <b>${r.chainOk}/${r.chain}</b></span>`:""}</div>
      <div class="stmt-wrap" data-t="${t.id}"><table><thead><tr>${r.saved?"":"<th></th>"}<th class="n">วันที่</th><th>รายการ</th><th>หมวด</th><th class="n">เข้า</th><th class="n">ออก</th><th class="n">คงเหลือ</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${r.saved?`<p class="meta" style="margin-top:10px">บันทึกลงบัญชีแล้ว ${r.savedCount??0} รายการ แก้หมวดย้อนหลังได้ในสมุดบัญชี</p>`:`<div class="tools"><button type="button" class="btn btn-solid" data-save="${t.id}" ${n?"":"disabled"}>บันทึกลงบัญชี ${n} รายการ</button><button type="button" class="btn" data-all="${t.id}">เลือกทั้งหมด</button><button type="button" class="btn" data-none="${t.id}">ไม่เลือกเลย</button></div>`}</div>`;
  }
  return `<div class="out">${md(r.md)}</div>${r.copy?`<button type="button" class="btn copy" data-copy="${t.id}">คัดลอกข้อความ</button>`:""}`;
}

function pickItems(t){
  const r=t.result, ed=S.slipEdit[t.id]||{}, sk=S.skip[t.id]||{};
  return r.items.map((it,i)=>({it,i})).filter(({it,i})=>it.amount>0&&it.date&&!(sk[i]??it.dup))
    .map(({it,i})=>{ const cat=ed[i]??it.category; return {...it,category:cat,kind:kindOf(cat,it.kind),_i:i}; });
}
function ledgerHtml(){
  const ms=monthsAvail(); if(!S.ledgerMonth||!ms.includes(S.ledgerMonth)) S.ledgerMonth=ms[0];
  const m=S.ledgerMonth, f=monthFigures(m); const maxC=f.expCat[0]?.[1]||1;
  const today=new Date().toISOString().slice(0,10);
  return `<div class="panel"><div class="board-head"><h3>สมุดบัญชี</h3><div style="display:flex;gap:6px;align-items:center"><button type="button" class="btn" id="catBtn" style="padding:5px 10px;font-size:13px">จัดการหมวด</button><select id="lMonth" style="width:auto">${ms.map(x=>`<option value="${x}" ${x===m?"selected":""}>${monthLabel(x)}</option>`).join("")}</select></div></div>
  <div class="totals"><div class="tot"><small>รายรับ</small><b style="color:var(--good)">${baht(f.income)}</b></div><div class="tot"><small>รายจ่าย</small><b>${baht(f.expense)}</b></div><div class="tot"><small>${f.profit>=0?"กำไร":"ขาดทุน"}</small><b style="color:${f.profit>=0?"var(--good)":"var(--bad)"}">${baht(Math.abs(f.profit))}</b></div></div>
  ${f.expCat.length?`<div class="bars">${f.expCat.slice(0,6).map(([c,v])=>`<div class="bar"><span title="${esc(c)}">${esc(c)}</span><div class="track"><div class="fill" style="width:${Math.max(3,v/maxC*100)}%"></div></div><span class="num">${fmt(v,0)}</span></div>`).join("")}</div>`:""}
  <div class="ledger-list">${f.rows.length?f.rows.map(r=>`<div class="lrow"><span class="d">${esc((r.date||"").slice(5))}</span><div class="m">${esc(r.merchant)}${r.note?`<small>${esc(r.note)}</small>`:""}${catSelect("lc-"+r.id,r.category,`data-lcat="${r.id}" aria-label="หมวดของ ${esc(r.merchant)}"`)}</div><span class="amt ${r.kind==="income"?"in":""}">${r.kind==="income"?"+":"−"}${fmt(r.amount)}</span><button type="button" class="x" data-ldel="${r.id}">${S.confirmL===r.id?"ยืนยัน":"ลบ"}</button></div>`).join(""):`<div class="empty">ยังไม่มีรายการเดือนนี้ อัปโหลดสลิปให้ทีม AI อ่าน หรือบันทึกเองด้านล่าง</div>`}</div>
  <details style="margin-top:12px"><summary>บันทึกรายการเอง</summary>
    <div class="row2"><div><label class="f" for="mDate">วันที่</label><input type="date" id="mDate" value="${today}"></div><div><label class="f" for="mAmt">จำนวนเงิน (บาท)</label><input type="number" id="mAmt" min="0" step="0.01" inputmode="decimal"></div></div>
    <label class="f" for="mCat">หมวด (เลือกหมวดรายรับ ระบบจะนับเป็นรายรับให้)</label>${catSelect("mCat",S.mCat||catsExp()[0]).replace("data-nr","")}
    <label class="f" for="mMer">ร้าน/ผู้รับ/รายละเอียด</label><input type="text" id="mMer">
    <button type="button" class="btn btn-solid" id="mAdd" style="margin-top:10px">เพิ่มรายการ</button>
  </details>
  ${S.downloads&&f.rows.length?`<button type="button" class="btn" id="csvBtn" style="margin-top:12px">ดาวน์โหลด CSV เดือนนี้</button>`:""}
  </div>`;
}

function boardHtml(d,title="งานที่กำลังทำ / เสร็จแล้ว"){ const ts=S.tasks.filter(t=>t.dept===d);
  return `<div class="panel"><div class="board-head"><h3>${title}</h3><small>${ts.length} งาน</small></div>
  <div class="tasks">${ts.length?ts.map(taskHtml).join(""):`<div class="empty">ยังไม่มีงานในห้องนี้<br>เลือกประเภทงานทางซ้าย แล้วกด “ส่งงานให้ทีม AI”</div>`}</div></div>`; }
function renderDept(d){
  if(d==="pm") return renderPM();
  const o=DEPTS[d];
  $("#view").innerHTML=`<div class="dept-bar"><span class="pill" style="background:${o.color}">${o.name}</span><button type="button" class="btn back" data-go="home">← กลับแผนที่</button></div>
  <div class="work"><div class="col">${teamHtml(d)}${formHtml(d)}${d==="finance"?ledgerHtml():""}${d==="it"?sitesHtml():""}</div>
  <div class="col">${boardHtml(d)}</div></div>`;
}
function sitesHtml(){
  const list=S.sites||[]; const anyAuto=list.some(s=>S.itstatus[s.id]);
  const row=s=>{ const st=S.itstatus[s.id]; const cls=!st?"":st.ok?"ok":"bad";
    const when=st&&st.checkedAt?ago(typeof st.checkedAt==="number"?st.checkedAt:Date.parse(st.checkedAt)):"";
    return `<div class="site"><span class="dot ${cls}" title="${!st?"ยังไม่เคยตรวจ":st.ok?"ปกติ":"มีปัญหา"}"></span><div style="min-width:0"><b>${esc(s.name||s.url)}</b><small>${esc(s.url)}</small>
      ${st?`<small>${st.ok?"ปกติ":"<span style=\"color:var(--bad)\">มีปัญหา</span>"}${when?` · ตรวจ ${esc(when)}`:""}${st.summary?` · ${esc(String(st.summary).slice(0,160))}`:""}</small>${Array.isArray(st.issues)&&st.issues.length?`<small>${st.issues.slice(0,3).map(i=>"• "+esc(String(i).slice(0,140))).join("<br>")}</small>`:""}`:`<small>ยังไม่มีผลตรวจอัตโนมัติ</small>`}</div>
      <button type="button" class="x" data-sdel="${esc(s.id)}">${S.confirmS===s.id?"ยืนยันลบ":"ลบ"}</button></div>`; };
  return `<div class="panel"><h3>เว็บไซต์ของบริษัท</h3>
    ${list.length?list.map(row).join(""):`<div class="empty" style="padding:16px">ยังไม่มีรายชื่อเว็บไซต์ เพิ่มเว็บของบริษัทไว้ที่นี่เพื่อใช้ตรวจอัตโนมัติ</div>`}
    <div class="row2" style="margin-top:8px"><div><label class="f" for="sName">ชื่อ</label><input type="text" id="sName" placeholder="เว็บหลัก"></div><div><label class="f" for="sUrl">ลิงก์</label><input type="text" id="sUrl" inputmode="url" placeholder="https://"></div></div>
    <button type="button" class="btn btn-solid" id="sAdd" style="margin-top:10px">เพิ่มเว็บไซต์</button>
    <p class="hint">${anyAuto?"ผลตรวจด้านบนมาจากการตรวจอัตโนมัติรายวัน":"ยังไม่ได้ตั้งการตรวจอัตโนมัติรายวัน ถ้าต้องการ บอก Claude ในแชตให้ตั้งให้ ระบบจะเข้าเว็บทุกเช้าแล้วรายงานผลไว้ตรงนี้"}</p></div>`;
}
function ownerOptions(cur){
  cur=cur||""; const ppl=S.people||[]; const ids=new Set(ppl.map(p=>p.id));
  const extra=cur.startsWith("u:")&&!ids.has(cur.slice(2))?`<option value="${esc(cur)}" selected>${esc(S.names[cur.slice(2)]||"สมาชิก")}</option>`:"";
  return `<option value="">ยังไม่กำหนด</option><optgroup label="ทีม AI">${DEPT_KEYS.map(k=>`<option value="dept:${k}" ${cur==="dept:"+k?"selected":""}>${DEPTS[k].name}</option>`).join("")}</optgroup>`
    +(ppl.length||extra?`<optgroup label="คนในทีม">${extra}${ppl.map(p=>`<option value="u:${esc(p.id)}" ${cur==="u:"+p.id?"selected":""}>${esc(p.name||"สมาชิก")}${p.isMe?" (ฉัน)":""}</option>`).join("")}</optgroup>`:"");
}
function ptaskHtml(t){
  const T=todayISO(); const done=t.status==="done"; const od=!done&&t.due&&t.due<T;
  return `<div class="ptask ${done?"done":""}">
    <select id="pts-${t.id}" data-nr data-ptf="status" data-ptid="${t.id}" aria-label="สถานะ">${Object.entries(P_ST).map(([k,v])=>`<option value="${k}" ${t.status===k?"selected":""}>${v}</option>`).join("")}</select>
    <div class="t">${t.priority==="high"&&!done?`<span class="tag">ด่วน</span> `:""}${esc(t.title)}${od?` <span class="od">· เลยกำหนด</span>`:""}</div>
    <select class="own" id="pto-${t.id}" data-nr data-ptf="owner" data-ptid="${t.id}" aria-label="ผู้รับผิดชอบ">${ownerOptions(t.owner)}</select>
    <input class="due" type="date" id="ptd-${t.id}" data-nr data-ptf="due" data-ptid="${t.id}" value="${esc(t.due||"")}" aria-label="กำหนดส่ง">
    <button type="button" class="x" data-ptdel="${t.id}">${S.confirmPt===t.id?"ยืนยัน":"ลบ"}</button></div>`;
}
function projHtml(p){
  const T=todayISO(); const s=projStats(p); const ts=[...s.ts].sort((a,b)=>(P_ORD[a.status]??9)-(P_ORD[b.status]??9)||(a.due||"9999").localeCompare(b.due||"9999"));
  const pct=s.total?Math.round(s.done/s.total*100):0;
  return `<div class="proj"><div class="proj-h"><h4>${esc(p.name)}</h4>

const SAVING=new Set();
async function saveImport(id,btn){
  const t=S.tasks.find(x=>x.id===id); if(!t||t.result.saved||SAVING.has(id)) return; SAVING.add(id); btn.disabled=true;
  const r=t.result, ed=S.slipEdit[id]||{}; const pick=pickItems(t);
  r.items.forEach((it,i)=>{ if(ed[i]!=null&&ed[i]!==it.category) learn(it.merchant||it.desc,ed[i]); });
  const srcNote = r.bank ? `${r.bank}${r.account?" "+r.account:""}` : "";
  let n=0;
  try{
    for(const it of pick){
      btn.textContent=`กำลังบันทึก ${n+1}/${pick.length}`;
      const row={date:it.date,merchant:it.merchant||it.desc,amount:it.amount,kind:it.kind,category:it.category,note:it.note||srcNote,source:r.kind};
      try{ await addLedger(row); }catch(e){ if(e?.code==="resource_exhausted"||e?.code==="unavailable"){ await new Promise(res=>setTimeout(res,1500+Math.random()*800)); await addLedger(row); } else throw e; }
      n++;
    }
    const items=r.items.map((it,i)=>({...it,category:ed[i]??it.category,kind:kindOf(ed[i]??it.category,it.kind)}));
    await patchTask(id,{result:{...r,items,saved:true,savedCount:n}});
    await flushLearn();
    toast(`บันทึกลงบัญชี ${n} รายการแล้ว`);
  }catch(e){ toast(e?.code==="quota_exceeded"?`บันทึกได้ ${n} รายการ แล้วพื้นที่เก็บข้อมูลเต็ม`:`บันทึกได้ ${n} รายการ ที่เหลือไม่สำเร็จ ลองกดอีกครั้ง`);
    if(n){ const sk=S.skip[id]=S.skip[id]||{}; pick.slice(0,n).forEach(it=>sk[it._i]=true); }
    btn.disabled=false; render();
  }finally{ SAVING.delete(id); }
}

    const list=id=>[...new Set($("#"+id).value.split("\n").map(s=>s.trim().slice(0,60)).filter(Boolean))].slice(0,60);
    const exp=list("cExp"), inc=list("cInc").filter(c=>!exp.includes(c));
    if(!exp.length||!inc.length) return toast("ต้องมีอย่างน้อย 1 หมวดในแต่ละฝั่ง");
    try{ await saveCats({exp,inc}); close(); toast("บันทึกหมวดแล้ว"); }catch(e){ toast("บันทึกไม่สำเร็จ ลองอีกครั้ง"); }
  };
  $("#cExp").focus();
}
async function manualAdd(){
  const amt=num($("#mAmt").value), date=$("#mDate").value, mer=$("#mMer").value.trim(), cat=$("#mCat").value;
  if(!(amt>0)) return toast("ใส่จำนวนเงินมากกว่า 0"); if(!date) return toast("เลือกวันที่");
  try{ await addLedger({date,merchant:mer||"ไม่ระบุ",amount:Math.round(amt*100)/100,kind:kindOf(cat),category:cat,note:"",source:"manual"});
    $("#mAmt").value=""; $("#mMer").value=""; S.ledgerMonth=monthKey(date); toast("เพิ่มรายการแล้ว"); render(); }
  catch(e){ toast("บันทึกไม่สำเร็จ ลองอีกครั้ง"); }
}
async function exportCsv(){
  const f=monthFigures(S.ledgerMonth); const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
  const csv="\ufeff"+["วันที่,ประเภท,หมวด,ร้าน/ผู้รับ,จำนวนเงิน,หมายเหตุ",...f.rows.map(r=>[r.date,r.kind==="income"?"รายรับ":"รายจ่าย",r.category,r.merchant,r.amount,r.note].map(q).join(","))].join("\n");
  try{ await S.downloads.save({filename:`บัญชี-${S.ledgerMonth}.csv`,data:new Blob([csv],{type:"text/csv"})}); }catch(e){ if(e?.code!=="cancelled"&&e?.code!=="declined") toast("ดาวน์โหลดไม่สำเร็จ"); }
}
function openBrand(){
  const b=S.brand||{};
  $("#modalRoot").innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="bt"><h2 id="bt">ข้อมูลบริษัท</h2><p>ทุกแผนกจะใช้ข้อมูลนี้ทำงาน ยิ่งละเอียด ผลงานยิ่งตรงกับธุรกิจ</p>
  <label class="f" for="bName">ชื่อบริษัท/แบรนด์</label><input type="text" id="bName" value="${esc(b.name)}">
  <label class="f" for="bBiz">ทำธุรกิจอะไร</label><input type="text" id="bBiz" value="${esc(b.business)}" placeholder="เช่น สถาบันสอนทักษะออนไลน์สำหรับคนทำงาน">
  <label class="f" for="bProd">สินค้า/บริการหลัก และช่วงราคา</label><textarea id="bProd" placeholder="เช่น คอร์ส Excel 1,990 บาท, คอร์ส Data 4,900 บาท">${esc(b.products)}</textarea>
  <label class="f" for="bAud">ลูกค้าเป้าหมาย</label><input type="text" id="bAud" value="${esc(b.audience)}" placeholder="เช่น พนักงานออฟฟิศอายุ 25-40">
  <label class="f" for="bTone">โทนแบรนด์</label><input type="text" id="bTone" value="${esc(b.tone)}" placeholder="เช่น เป็นกันเอง เข้าใจง่าย ไม่ขายของหนัก">
  <div class="acts"><button type="button" class="btn" id="bCancel">ยกเลิก</button><button type="button" class="btn btn-solid" id="bSave">บันทึก</button></div></div></div>`;
  const close=()=>$("#modalRoot").innerHTML="";
  $("#bCancel").onclick=close; $("#ov").onclick=e=>{ if(e.target.id==="ov") close(); };
  $("#bSave").onclick=async()=>{ const nb={name:$("#bName").value.trim(),business:$("#bBiz").value.trim(),products:$("#bProd").value.trim(),audience:$("#bAud").value.trim(),tone:$("#bTone").value.trim()};
    try{ await saveBrand(nb); close(); toast("บันทึกข้อมูลบริษัทแล้ว"); }catch(e){ toast("บันทึกไม่สำเร็จ ลองอีกครั้ง"); } };
  $("#bName").focus();
}

async function ensureNames(){
  if(!S.user||!S.user.profiles) return;
  const ids=[...new Set([...S.tasks.map(t=>t.byId),...S.ptasks.map(t=>t.owner&&t.owner.startsWith("u:")?t.owner.slice(2):null)].filter(i=>i&&!(i in S.names)))].slice(0,64); if(!ids.length) return;
  ids.forEach(i=>S.names[i]=""); try{ const ps=await S.user.profiles(ids); ids.forEach(i=>S.names[i]=(ps&&ps[i]&&ps[i].name)||""); render(); }catch{}
}

// ---------- boot ----------
const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
{ const h=location.hash.slice(1); if(DEPTS[h]) S.route=h; }
render();
(async()=>{
  const [db,sample,user,downloads]=await Promise.all([use("db"),use("sample"),use("user"),use("downloads")]);
  S.db=db; S.sample=sample; S.user=user; S.downloads=downloads;
  if(sample&&sample.limits){ try{ const l=await sample.limits(); S.imgMax=l?.images?.maxCount||0; }catch{} }
  if(user&&user.id){ try{ S.uid=await user.id(); }catch{} }
  S.ready=true;
  if(db){
    db.collection("tasks").orderBy("createdAt","desc").limit(150).onSnapshot(s=>{ S.tasks=s.docs.map(d=>({...d.data(),id:d.id})); scheduleRender(); ensureNames(); },e=>console.warn(e));
    db.collection("ledger").orderBy("date","desc").limit(1000).onSnapshot(s=>{ S.ledger=s.docs.map(d=>({...d.data(),id:d.id})); scheduleRender(); },e=>console.warn(e));
    db.doc("settings/brand").onSnapshot(s=>{ S.brand=s.exists?s.data():{}; scheduleRender(); },e=>console.warn(e));
    db.doc("settings/categories").onSnapshot(s=>{ const c=s.exists?s.data():null; S.cats=(c&&Array.isArray(c.exp)&&c.exp.length&&Array.isArray(c.inc)&&c.inc.length)?{exp:c.exp.map(String),inc:c.inc.map(String)}:{exp:DEF_EXP,inc:DEF_INC}; scheduleRender(); },e=>console.warn(e));
    db.collection("projects").orderBy("createdAt","desc").limit(300).onSnapshot(s=>{ S.projects=s.docs.map(d=>({...d.data(),id:d.id})); scheduleRender(); },e=>console.warn(e));
    db.collection("ptasks").limit(1000).onSnapshot(s=>{ S.ptasks=s.docs.map(d=>({...d.data(),id:d.id})); scheduleRender(); ensureNames(); },e=>console.warn(e));
    db.doc("settings/sites").onSnapshot(s=>{ const l=s.exists?s.data().list:null; S.sites=Array.isArray(l)?l.filter(x=>x&&x.id&&x.url):[]; scheduleRender(); },e=>console.warn(e));
    db.collection("itstatus").limit(50).onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.itstatus=o; scheduleRender(); },e=>console.warn(e));
    db.doc("settings/catmap").onSnapshot(s=>{ const m=s.exists?s.data().map:null; S.catmap=(m&&typeof m==="object")?m:{}; },e=>console.warn(e));
  }
  render();
})();
})();
</script>
